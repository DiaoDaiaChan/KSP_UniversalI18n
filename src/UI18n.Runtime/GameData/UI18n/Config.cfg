// UniversalI18n (UI18n) —— 玩家配置。
// 改完需要重启 KSP 才生效（Startup.Instantly 只读一次）。
UI18N
{
	// 总开关。False = 完全不装 patch，游戏行为与没装本 Mod 一致。
	Enabled = True

	// 强制覆盖：语言不是中文时也翻译（调试与汉化测试用）。默认关（决策 D32）。
	ForceOverride = False

	// 语言包更新检查（数据层，不产生 hook）。
	CheckForUpdates = True

	// 允许自动下载语言包更新（默认关，只提示不下载）。
	AutoDownload = False

	// 是否匿名上报未翻译文本（默认关，不上报任何东西）。
	ReportOptIn = False

	// 字典条目上限，防止异常语言包把内存吃光。
	MaxEntries = 60000

	// ===== 字体（P2）=====
	// Off       = 完全不碰字体，译文照常显示（缺字就是方框，玩家自担）
	// OsFont    = 从系统字体里挑一个含汉字的动态字面注入 uGUI（默认；不动 TMP）
	// Bundled   = 从 BundledFontPath 的 AssetBundle 里取字体，取不到则回落 OsFont
	FontMode = OsFont

	// FontMode=OsFont/Bundled 时的首选系统字体名（按精确名匹配，不存在就按内置候选顺序回退：
	// Microsoft YaHei → Microsoft YaHei UI → SimHei → Noto Sans SC → DengXian → SimSun → Microsoft JhengHei）
	OsFontName = Microsoft YaHei

	// FontMode=Bundled 时字体包路径。相对路径按 GameData/UI18n 解析；文件不存在会记 Warn 并回落 OsFont。
	BundledFontPath =

	// TMP 三档：Auto = 能找到含汉字的 TMP 资产就注入 fallback，找不到就保留原文（默认，可判定降级）
	//           KeepSource = 一律不碰 TMP，TMP 文本永远保留原文
	//           Force      = 照常翻译，接受方框（KSP 1.12 是 TMP 1.2 位图图集，无法运行时造字）
	TmpMode = Auto

	// ===== 诊断（round 2）=====
	// 退出时最多打印多少条「首次命中样本」（hit sample: [patch] 原文 => 译文），0 = 关闭采样。
	// 只影响日志条数；distinct hits 计数是全量去重的，不受这个值影响。
	HitSampleLimit = 64

	// ===== 缺命中捕获（task-30）=====
	// True = 把字典里没有的 UI 文本按 FNV-1a 去重聚合，退出时与每 60 s 追加写到
	//        <KSP 根>/PluginData/UI18n/capture-<时间戳>.jsonl，供翻译流水线补齐。
	// 隐私：只写本地文件，绝不上传；上传只受 ReportOptIn 控制，且当前版本没有任何上传代码。
	// 过滤：纯数字 / 纯空白 / 纯标点 / 长度 < 2 / 只含 ASCII 标识符且 ≤ 3 字符的串不录。
	CaptureMisses = True

	// 单局最多捕获多少条 distinct 缺命中（0 = 不限制）。触顶后只计 overflow，日志给一行 cap reached。
	CaptureMaxEntries = 5000

	// ===== 实验开关（task-31，默认关，正常玩家不要开）=====
	// True = 额外给 IMGUI 的统一出口 GUIStyle.Internal_Draw / Internal_Draw2 装 2 个「影子前缀」：
	//        只统计「统一出口看到哪些文本、其中多少条字典里有译文」，与现有 13 个 IMGUI hook 做差集，
	//        用来判断这 13 个 hook 能不能收敛成 2 个。影子前缀按值接收 GUIContent，绝不修改它。
	// False = 一个 patch 都不装、一行日志都不打（默认，与没有这个开关时完全一致）。
	// 开启后每 60 s 打一行 shadow 汇总，退出时打前 50 条并写 PluginData/UI18n/shadow-<时间戳>.jsonl。
	ShadowStyleDraw = False
}
